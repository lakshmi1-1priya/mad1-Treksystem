{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-3 text-center">Login</h3>
                <form method="POST" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>
                <hr>
                <p class="text-center mb-1">New trekker? <a href="{{ url_for('main.register_trekker') }}">Register here</a></p>
                <p class="text-center mb-0">Want to join as staff? <a href="{{ url_for('main.register_staff') }}">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
