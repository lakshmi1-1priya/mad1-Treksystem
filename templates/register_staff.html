{% extends "base.html" %}
{% block title %}Register - Trek Staff{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-1 text-center">Register as Trek Staff</h3>
                <p class="text-muted text-center small mb-3">Your account will need Admin approval before you can log in.</p>
                <form method="POST" action="{{ url_for('main.register_staff') }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Years of Experience</label>
                        <input type="number" name="experience_years" class="form-control" min="0" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit Registration</button>
                </form>
                <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('main.login') }}">Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
